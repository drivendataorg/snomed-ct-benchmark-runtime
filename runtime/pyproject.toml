[project]
name = "snomed-ct-benchmark-runtime"
version = "0.2.0"
description = "Runtime with vllm, pytorch and faiss-gpu at CUDA 12.6 for SNOMED-CT benchmark"
requires-python = ">=3.12,<3.13"

dependencies = [
    "accelerate==1.12.0",
    "aiofiles==25.1.0",
    "aiohttp==3.13.3",
    "attrs==25.4.0",
    "certifi==2026.1.4",
    "chromadb==1.4.0",
    "click==8.3.1",
    "cloudpickle==3.1.2",
    "datasets==4.4.2",
    "dill==0.4.0",
    "diskcache==5.6.3",
    "einops==0.8.1",
    "fastapi==0.128.0",
    "filelock==3.20.2",
    "fsspec==2025.10.0",
    "gensim==4.4.0",
    "grpcio==1.76.0",
    "httpcore==1.0.9",
    "httpx==0.28.1",
    "huggingface-hub==0.36.0",
    "importlib-metadata==8.7.1",
    "jinja2==3.1.6",
    "jsonpickle==4.1.1",
    "langchain-community==0.4.1",
    "langchain==1.2.3",
    "lightgbm==4.6.0",
    "loguru==0.7.3",
    "more-itertools==10.8.0",
    "ninja==1.13.0",
    "numba==0.61.2",
    "numpy==2.2.6",
    "opencv-python==4.12.0.88",
    "packaging==25.0",
    "pandas==2.3.3",
    "peft==0.18.1",
    "pillow==12.1.0",
    "polars==1.36.1",
    "psutil==7.2.1",
    "pydantic-settings==2.12.0",
    "pydantic==2.12.5",
    "pytorch-lightning==2.6.0",
    "pyyaml==6.0.3",
    "regex==2025.11.3",
    "requests==2.32.5",
    "sacremoses==0.1.1",
    "safetensors==0.7.0",
    "scikit-learn==1.8.0",
    "scipy==1.16.3",
    "sentence-transformers==5.2.0",
    "sentencepiece==0.2.1",
    "spacy==3.8.11",
    "starlette==0.50.0",
    "statsmodels==0.14.6",
    "thinc==8.3.10",
    "tiktoken==0.12.0",
    "timm==1.0.24",
    "tokenizers==0.22.2",
    "torch==2.9.0+cu126",
    "torchaudio==2.9.0+cu126",
    "torchvision==0.24.0+cu126",
    "tqdm==4.67.1",
    "transformers==4.57.3",
    "urllib3==2.6.3",
    "uvicorn==0.40.0",
    "vllm==0.13.0",
    "xarray==2025.12.0",
    "xformers==0.0.33.post1",
]

[tool.uv]
required-version = ">=0.9.25"
environments = ["sys_platform == 'linux'"]
no-build-package = ["vllm"]

# Constrain dependencies to be compatible with faiss 1.13.2 without installing it
# (faiss-gpu is built from source and installed separately)
constraint-dependencies = ["faiss-cpu>=1.13.2,<1.14"]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = [
  { index = "pytorch-cu126", marker = "sys_platform == 'linux'"},
]
torchvision = [
  { index = "pytorch-cu126", marker = "sys_platform == 'linux'"},
]
torchaudio = [
  { index = "pytorch-cu126", marker = "sys_platform == 'linux'"},
]

[project.optional-dependencies]
test = ["pytest>=9.0"]